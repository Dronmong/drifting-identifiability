name = "drifting_identifiability"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DriftingIdentifiability"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
warningAsError = true
maxSynthPendingDepth = 32
linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "DriftingIdentifiability"
